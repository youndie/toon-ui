org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
kotlin.code.style=official

version=0.1.0

# What the shared conventions read (`io.github.youndie.sborka`).
sborka.group=io.github.youndie
sborka.repository=youndie/toon-ui
sborka.description=The toon-ui cartoon kit for Compose Multiplatform.
sborka.inceptionYear=2026
sborka.licence=MIT License
sborka.jvmFloor=25

# The wasmJs target is the reason: the Kotlin plugin declares repositories on the project for Node,
# Yarn and Binaryen, and the two stricter modes break it (oldge-ui and kvadrant-ui met the same).
sborka.repositoriesMode=PREFER_PROJECT
