<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Figtree:wght@400;500;600;700;800&family=Titan+One&family=Fredoka:wght@400;500;600;700&display=swap">
<script src="./toon-engine.js?v=10"></script>
<script src="./toon-kit.js?v=11"></script>
</helmet>
<div onPointerDown="{{ down }}" onPointerUp="{{ up }}" onPointerLeave="{{ leave }}" onPointerCancel="{{ leave }}" style="position:relative; display:inline-block; vertical-align:top; width:{{ w }}px; height:{{ h }}px; cursor:{{ cursor }}; touch-action:manipulation; user-select:none; -webkit-tap-highlight-color:transparent;">
  <svg ref="{{ svgRef }}" width="{{ sw }}" height="{{ sh }}" viewBox="{{ vb }}" style="position:absolute; left:{{ sx }}px; top:{{ sy }}px; overflow:{{ ov }}; pointer-events:none;"></svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:280,&quot;height&quot;:291},&quot;open&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;items&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;edit:Edit,share:Share,delete:Delete&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;selected&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:-1,&quot;min&quot;:-1,&quot;max&quot;:9,&quot;tsType&quot;:&quot;number&quot;},&quot;width&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:200,&quot;min&quot;:140,&quot;max&quot;:400,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;},&quot;onSelect&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(index: number) => void&quot;},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;auto&quot;,&quot;light&quot;,&quot;night&quot;,&quot;cel&quot;],&quot;default&quot;:&quot;auto&quot;,&quot;tsType&quot;:&quot;'auto'|'light'|'night'|'cel'&quot;,&quot;section&quot;:&quot;Theme&quot;}}">
class Component extends DCLogic {
  componentDidMount() {
    const go = () => { if (!window.ToonKit || !window.ToonEngine) { this._w = setTimeout(go, 40); return; } this._k = window.ToonKit.attach(this, 'menu'); this.forceUpdate(); };
    go();
    if (document.fonts) document.fonts.ready.then(() => { if (this._k) { this._k.last = ''; this.forceUpdate(); this._k.draw(); } });
  }
  componentDidUpdate(prev) { if (this._k) this._k.update(prev); }
  componentWillUnmount() { clearTimeout(this._w); if (this._k) this._k.detach(); }
  renderVals() { return (window.ToonKit && window.ToonKit.vals(this, 'menu')) || { w: 200, h: 171, sw: 200, sh: 171, vb: '0 0 200 171', sx: 0, sy: 0, ov: 'visible', cursor: 'default', svgRef: null, down: () => {}, up: () => {}, leave: () => {}, move: () => {} }; }
}
</script>
</body>
</html>
