<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Figtree:wght@400;500;600;700;800&family=Titan+One&family=Fredoka:wght@400;500;600;700&display=swap">
<script src="./toon-engine.js?v=10"></script>
<script src="./toon-kit.js?v=11"></script>
</helmet>
<div onPointerDown="{{ down }}" onPointerUp="{{ up }}" onPointerLeave="{{ leave }}" onPointerCancel="{{ leave }}" style="position:relative; display:inline-block; vertical-align:top; width:{{ w }}px; height:{{ h }}px; cursor:{{ cursor }}; touch-action:manipulation; user-select:none; -webkit-tap-highlight-color:transparent;">
  <svg ref="{{ svgRef }}" width="{{ sw }}" height="{{ sh }}" viewBox="{{ vb }}" style="position:absolute; left:{{ sx }}px; top:{{ sy }}px; overflow:{{ ov }}; pointer-events:none;"></svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:128,&quot;height&quot;:168},&quot;icon&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;search&quot;,&quot;back&quot;,&quot;chevron&quot;,&quot;more&quot;,&quot;person&quot;,&quot;plus&quot;,&quot;close&quot;,&quot;edit&quot;,&quot;heart&quot;,&quot;star&quot;,&quot;calendar&quot;,&quot;tune&quot;,&quot;check&quot;,&quot;warning&quot;,&quot;info&quot;,&quot;bell&quot;, &quot;menu&quot;, &quot;settings&quot;, &quot;delete&quot;, &quot;share&quot;, &quot;filter&quot;, &quot;refresh&quot;, &quot;lock&quot;, &quot;eye&quot;],&quot;default&quot;:&quot;heart&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;standard&quot;,&quot;filled&quot;],&quot;default&quot;:&quot;standard&quot;,&quot;tsType&quot;:&quot;'standard'|'filled'&quot;},&quot;selected&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;toggle&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;disabled&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onClick&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() => void&quot;},&quot;onChange&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(selected: boolean) => void&quot;},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;auto&quot;,&quot;light&quot;,&quot;night&quot;,&quot;cel&quot;],&quot;default&quot;:&quot;auto&quot;,&quot;tsType&quot;:&quot;'auto'|'light'|'night'|'cel'&quot;,&quot;section&quot;:&quot;Theme&quot;}}">
class Component extends DCLogic {
  componentDidMount() {
    const go = () => { if (!window.ToonKit || !window.ToonEngine) { this._w = setTimeout(go, 40); return; } this._k = window.ToonKit.attach(this, 'iconbutton'); this.forceUpdate(); };
    go();
    if (document.fonts) document.fonts.ready.then(() => { if (this._k) { this._k.last = ''; this.forceUpdate(); this._k.draw(); } });
  }
  componentDidUpdate(prev) { if (this._k) this._k.update(prev); }
  componentWillUnmount() { clearTimeout(this._w); if (this._k) this._k.detach(); }
  renderVals() { return (window.ToonKit && window.ToonKit.vals(this, 'iconbutton')) || { w: 48, h: 48, sw: 48, sh: 48, vb: '0 0 48 48', sx: 0, sy: 0, ov: 'visible', cursor: 'default', svgRef: null, down: () => {}, up: () => {}, leave: () => {} }; }
}
</script>
</body>
</html>
