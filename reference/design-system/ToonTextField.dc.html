<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Figtree:wght@400;500;600;700;800&family=Titan+One&family=Fredoka:wght@400;500;600;700&display=swap">
<script src="./toon-engine.js?v=10"></script>
<script src="./toon-kit.js?v=11"></script>
</helmet>
<div onPointerDown="{{ down }}" onPointerUp="{{ up }}" style="position:relative; display:inline-block; vertical-align:top; width:{{ w }}px; height:{{ h }}px;">
  <svg ref="{{ svgRef }}" width="{{ sw }}" height="{{ sh }}" viewBox="{{ vb }}" style="position:absolute; left:{{ sx }}px; top:{{ sy }}px; overflow:visible; pointer-events:none;"></svg>
  <input value="{{ value }}" onChange="{{ onInput }}" onFocus="{{ onFocus }}" onBlur="{{ onBlur }}" disabled="{{ dis }}" style="position:absolute; left:0; top:22px; width:{{ iw }}px; height:56px; box-sizing:border-box; padding:3px 20px 0 20px; margin:0; border:0; outline:none; background:transparent; font-family:{{ ff }}; font-weight:500; font-size:16px; color:{{ tc }}; caret-color:transparent;">
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:422,&quot;height&quot;:226},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Plan name&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;value&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;helper&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;error&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;width&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:342,&quot;min&quot;:120,&quot;max&quot;:600,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;},&quot;disabled&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onChange&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(value: string) => void&quot;},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;auto&quot;,&quot;light&quot;,&quot;night&quot;,&quot;cel&quot;],&quot;default&quot;:&quot;auto&quot;,&quot;tsType&quot;:&quot;'auto'|'light'|'night'|'cel'&quot;,&quot;section&quot;:&quot;Theme&quot;}}">
class Component extends DCLogic {
  componentDidMount() {
    const go = () => { if (!window.ToonKit || !window.ToonEngine) { this._w = setTimeout(go, 40); return; } this._k = window.ToonKit.attach(this, 'textfield'); this.forceUpdate(); };
    go();
    if (document.fonts) document.fonts.ready.then(() => { if (this._k) { this._k.last = ''; this.forceUpdate(); this._k.draw(); } });
  }
  componentDidUpdate(prev) { if (this._k) this._k.update(prev); }
  componentWillUnmount() { clearTimeout(this._w); if (this._k) this._k.detach(); }
  renderVals() { return (window.ToonKit && window.ToonKit.vals(this, 'textfield')) || { w: 342, h: 106, sw: 342, sh: 106, vb: '0 0 342 106', sx: 0, sy: 0, ov: 'visible', cursor: 'default', svgRef: null, down: () => {}, up: () => {}, leave: () => {}, value: '', ff: 'Figtree', tc: '#2B211C', iw: 342, dis: false, onInput: () => {}, onFocus: () => {}, onBlur: () => {} }; }
}
</script>
</body>
</html>
