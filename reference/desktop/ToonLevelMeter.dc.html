<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Figtree:wght@400;500;600;700;800&family=Titan+One&family=Fredoka:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="./desktop-base.css">
<script src="./toon-engine.js?v=10"></script>
<script src="./toon-kit.js?v=11"></script>
<script src="./desktop-engine.js?v=1"></script>
</helmet>
<div style="display:flex; flex-direction:column; gap:8px; width:{{ w }}px; font-family:{{ t.body }};">
  <div style="display:flex; align-items:center; gap:10px; min-height:22px;">
    <svg ref="{{ icRef }}" width="20" height="20" style="display:block; overflow:visible; flex:none;"></svg>
    <div style="font-weight:700; font-size:15px; color:{{ t.text }}; white-space:nowrap;">{{ label }}</div>
    <div style="font-weight:600; font-size:13px; color:{{ t.muted }}; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; min-width:0;">{{ source }}</div>
    <div style="font-weight:800; font-size:13px; color:{{ stc }}; white-space:nowrap;">{{ status }}</div>
  </div>
  <svg ref="{{ svgRef }}" width="{{ mw }}" height="20" style="display:block; overflow:visible;"></svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:380,&quot;height&quot;:90},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Микрофон&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;source&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;MacBook Pro&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;icon&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;mic&quot;,&quot;wave&quot;],&quot;default&quot;:&quot;mic&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;live&quot;,&quot;silent&quot;,&quot;clip&quot;],&quot;default&quot;:&quot;live&quot;,&quot;tsType&quot;:&quot;'live'|'silent'|'clip'&quot;},&quot;level&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;min&quot;:0,&quot;max&quot;:1,&quot;step&quot;:0.05,&quot;default&quot;:0.6,&quot;tsType&quot;:&quot;number&quot;},&quot;animate&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;width&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;min&quot;:160,&quot;max&quot;:600,&quot;default&quot;:320,&quot;tsType&quot;:&quot;number&quot;},&quot;seed&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;},&quot;lang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;ru&quot;,&quot;en&quot;],&quot;default&quot;:&quot;ru&quot;,&quot;tsType&quot;:&quot;'ru'|'en'&quot;},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;auto&quot;,&quot;light&quot;,&quot;night&quot;,&quot;cel&quot;],&quot;default&quot;:&quot;auto&quot;,&quot;tsType&quot;:&quot;'auto'|'light'|'night'|'cel'&quot;,&quot;section&quot;:&quot;Theme&quot;}}">
class Component extends DCLogic {
  svgRef = e => { this.el = e; this.paint(); };
  icRef = e => { this.ic = e; this.paint(); };
  componentDidMount() {
    const go = () => { const PK = window.DesktopKit; if (!PK || !PK.ready()) { this._w = setTimeout(go, 40); return; } this.k = PK.ctl(this, () => this.paint()); this.k.alive = () => (this.props.state || 'live') !== 'silent' && this.props.animate !== false && !PK.reduce(); this.k.wake(); this.forceUpdate(); };
    go();
  }
  componentDidUpdate() { this.paint(); this.k && this.k.wake(); }
  componentWillUnmount() { clearTimeout(this._w); this.k && this.k.detach(); }
  paint() {
    const PK = window.DesktopKit; if (!this.k) return; const p = this.props, E = PK.E(), T = PK.T(p), st = p.state || 'live', w = (+p.width || 320) - (st === 'clip' ? 24 : 0);
    const lv = st === 'clip' ? 1 : this.k.alive() ? E.livelevel(PK.clock(), +p.seed || 0) * (p.level ?? .7) / .7 : (p.level ?? .6);
    if (this.el) PK.paint(this.el, E.levelMeter(T, w, { state: st, level: lv }));
    if (this.ic) PK.paint(this.ic, { L: E.icon(T, p.icon || 'mic', 0, 0, { size: 20, color: T.text }), X: [] });
  }
  renderVals() {
    const PK = window.DesktopKit, ok = PK && PK.ready() && this.k, p = this.props, t = ok ? PK.tok(p) : {}, st = p.state || 'live', en = p.lang === 'en';
    const status = st === 'silent' ? (en ? 'Silence' : 'Тишина') : st === 'clip' ? (en ? 'Too loud' : 'Перегруз') : '';
    return { t, w: +p.width || 320, mw: +p.width || 320, label: p.label || (en ? 'Microphone' : 'Микрофон'), source: p.source || '', status, stc: st === 'silent' ? t.text : t.dangerText, svgRef: this.svgRef, icRef: this.icRef };
  }
}
</script>
</body>
</html>
